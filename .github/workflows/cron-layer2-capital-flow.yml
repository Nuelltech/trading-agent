name: Cron - Camada 2 (Fluxo de Capital Semanal - Agente Automatizado)

on:
  schedule:
    # Executa semanalmente todas as sextas-feiras às 22h00 UTC (23h00 Lisboa / pós-fecho EUA)
    - cron: '0 22 * * 5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Data da Sessão/Semana a processar (formato YYYY-MM-DD, ex: 2026-08-07)'
        required: false
        default: ''

jobs:
  run-capital-flow-layer2:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests pymysql sqlalchemy cryptography pydantic pydantic-settings numpy

      - name: Executar Agente Automatizado da Camada 2 (Tarefa 1 & Tarefa 2)
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NOTION_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY || secrets.NOTION_TOKEN }}
          NOTION_CONFIG_DB_ID: ${{ secrets.NOTION_CONFIG_DB_ID || 'fb3a2102-c785-46c9-b2b4-5adecd9d5482' }}
          NOTION_CAMADA2_DB_ID: ${{ secrets.NOTION_CAMADA2_DB_ID || secrets.NOTION_FLUXO_CAPITAL_DATABASE_ID }}
          NOTION_CAMADA0_DB_ID: ${{ secrets.NOTION_CAMADA0_DB_ID || 'cc9794eb-da24-4c9a-8116-ba859efa65aa' }}
          NOTION_CLAUDE_REGIME_DATABASE_ID: ${{ secrets.NOTION_CLAUDE_REGIME_DATABASE_ID || secrets.NOTION_PAINEL_MERCADO_DATABASE_ID }}
          ANTHROPIC_API_KEY_TRADING: ${{ secrets.ANTHROPIC_API_KEY_TRADING || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY_TRADING }}
          CLAUDE_MODEL: 'claude-sonnet-4-6'
        run: |
          python scripts/run_capital_flow_layer2.py "${{ github.event.inputs.target_date }}"
