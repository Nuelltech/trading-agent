name: Manual - Backfill Close Diário Notion (Datas Específicas)

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Datas a sincronizar (formato YYYY-MM-DD, separadas por vírgula)"
        required: true
        default: "2026-08-07,2026-08-10,2026-08-11"
      dry_run:
        description: "Dry run (true = só mostra o que faria, sem escrever no Notion)"
        required: false
        default: "false"

jobs:
  backfill-notion-close:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests pymysql sqlalchemy cryptography pydantic pydantic-settings numpy

      - name: Executar Backfill Close Diário para Notion
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NOTION_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_CLAUDE_CLOSE_DATABASE_ID: ${{ secrets.NOTION_CLAUDE_CLOSE_DATABASE_ID }}
          NOTION_CONFIG_DB_ID: ${{ secrets.NOTION_CONFIG_DB_ID }}
          BACKFILL_DATES: ${{ github.event.inputs.dates }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python scripts/notion_close_backfill.py
