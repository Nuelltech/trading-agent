name: Teste - Publicar Sinal no Notion (Sinais de Liquidez)

on:
  workflow_dispatch:

jobs:
  test-notion-signal:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pymysql sqlalchemy cryptography pydantic pydantic-settings

      - name: Executar Teste de Publicação no Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_LIQUIDITY_DATABASE_ID: ${{ secrets.NOTION_LIQUIDITY_DATABASE_ID }}
        run: |
          python scripts/test_publish_notion_signal.py
