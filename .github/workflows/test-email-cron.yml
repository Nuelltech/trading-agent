name: Teste - Envio de Email (Hello World)

on:
  workflow_dispatch: # Permite disparo manual no separador Actions do GitHub
  schedule:
    # Agendamento opcional: Executa diariamente às 08:00 UTC para validar serviço de email
    - cron: '0 8 * * *'

jobs:
  test-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Executar Teste de Envio de Email (Hello World)
        env:
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM || secrets.SMTP_USERNAME }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_SERVER_HOSTINGER: ${{ secrets.SMTP_SERVER_HOSTINGER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER_HOSTINGER || secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_HOSTINGER_PASSWD: ${{ secrets.SMTP_HOSTINGER_PASSWD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_HOSTINGER_PASSWD || secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEBUG_SMTP: '1'
        run: |
          python scripts/test_send_email.py --plan ALL
