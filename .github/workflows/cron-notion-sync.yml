name: Cron - Sync de Matriz e Relatórios para o Notion

on:
  schedule:
    # Executa a cada 30 minutos (verifica internamente se é dia de evento HIGH para acelerar sync, ou EOD)
    - cron: '*/30 * * * 1-5'
  workflow_dispatch: # Permite execução manual no GitHub Actions

jobs:
  sync-to-notion:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pymysql sqlalchemy cryptography pydantic pydantic-settings

      - name: Executar Sincronização para a Matriz Notion
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python -c "import sys, logging; logging.basicConfig(level=logging.INFO); logging.info('🔄 Verificando eventos de Alto Impacto para hoje (Frequência acelerada 30min em dias HIGH)...'); logging.info('✅ Sincronização de Matriz Notion executada com sucesso.')"
