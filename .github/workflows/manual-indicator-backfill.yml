name: Manual - Backfill Histórico Indicadores (MySQL & Notion)

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Passo a executar (all, mysql, notion)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'mysql'
          - 'notion'

jobs:
  indicator-backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests pymysql sqlalchemy cryptography pydantic pydantic-settings yfinance pandas

      - name: Executar Backfill Histórico de Indicadores
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NOTION_API_KEY }}
          NOTION_CLAUDE_OHLC_DATABASE_ID: ${{ secrets.NOTION_CLAUDE_OHLC_DATABASE_ID }}
          NOTION_CLAUDE_CLOSE_DATABASE_ID: ${{ secrets.NOTION_CLAUDE_CLOSE_DATABASE_ID }}
        run: |
          python scripts/backfill_historical_indicators.py --step ${{ github.event.inputs.step }}
