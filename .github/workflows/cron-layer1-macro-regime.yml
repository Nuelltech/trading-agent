name: Cron - Camada 1 (Regime Macro Diário - Agente Automatizado)

on:
  schedule:
    # Executa diariamente às 22h00 UTC (23h00 Lisboa) de segunda a sexta-feira (pós-fecho EUA)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Permite execução manual no GitHub Actions para testes

jobs:
  run-macro-regime-layer1:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests pymysql sqlalchemy cryptography pydantic pydantic-settings numpy

      - name: Executar Agente Automatizado da Camada 1 (Tarefa 1 & Tarefa 2)
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NOTION_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY || secrets.NOTION_TOKEN }}
          NOTION_CLAUDE_REGIME_DATABASE_ID: ${{ secrets.NOTION_CLAUDE_REGIME_DATABASE_ID || secrets.NOTION_PAINEL_MERCADO_DATABASE_ID }}
          NOTION_CAMADA0_DB_ID: ${{ secrets.NOTION_CAMADA0_DB_ID || 'cc9794eb-da24-4c9a-8116-ba859efa65aa' }}
          ANTHROPIC_API_KEY_TRADING: ${{ secrets.ANTHROPIC_API_KEY_TRADING || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY_TRADING }}
          CLAUDE_MODEL: 'claude-3-5-haiku-20241022'
        run: |
          python scripts/run_macro_regime_layer1.py
