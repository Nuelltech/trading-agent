name: Cron - Gemini Trader (Síntese Estratégica & Briefing Pré-Trade)

on:
  schedule:
    # ─── MODO ETL DIURNO ─────────────────────────────────────────────────────────
    # Corre de 30 em 30 minutos (Segunda a Sexta) durante o horário de mercado.
    # Executa apenas as Fases 1-4: atualiza dados quantitativos no Notion.
    # A API do Gemini NÃO é invocada (ENABLE_GEMINI_API não definida).
    - cron: '*/30 8-20 * * 1-5'

    # ─── MODO BRIEFING NOTURNO ───────────────────────────────────────────────────
    # Corre 1x por dia às 22h00 hora de Lisboa (21h00 UTC, ou 20h00 UTC no inverno).
    # Executa as Fases 1-5: ETL + Veredito Tático da IA (Gemini).
    # Usa a ENABLE_GEMINI_API=true para ativar a Fase 5.
    # Nota: UTC+1 (BST/WEST verão) → 22h00 Lisboa = 21h00 UTC
    - cron: '0 21 * * 1-5'

  workflow_dispatch:
    # Permite execução manual no GitHub Actions, com opção de ativar Gemini
    inputs:
      enable_gemini:
        description: 'Ativar API Gemini (Fase 5 - Briefing Noturno)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  gemini-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests pymysql sqlalchemy cryptography pydantic pydantic-settings "google-genai>=0.8.0" google-generativeai

      - name: Determinar modo de execução
        id: mode
        run: |
          # Verifica se este trigger é o cron das 22h00 (minuto=0, hora=21 UTC)
          CURRENT_MINUTE=$(date -u +%M)
          CURRENT_HOUR=$(date -u +%H)
          IS_EVENING_BRIEFING="false"

          # Se for o cron das 22h00 (21:00 UTC ±1 min de tolerância) OU se for manual com gemini=true
          if [ "$CURRENT_HOUR" = "21" ] && [ "$CURRENT_MINUTE" = "00" ]; then
            IS_EVENING_BRIEFING="true"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.enable_gemini }}" = "true" ]; then
            IS_EVENING_BRIEFING="true"
          fi

          echo "enable_gemini=$IS_EVENING_BRIEFING" >> $GITHUB_OUTPUT
          if [ "$IS_EVENING_BRIEFING" = "true" ]; then
            echo "🌙 MODO: BRIEFING NOTURNO (Fases 1-5 com Gemini API)"
          else
            echo "📊 MODO: ETL DIURNO (Fases 1-4, sem Gemini API)"
          fi

      - name: Executar Pipeline Gemini Trader
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NOTION_API_KEY }}
          NOTION_CONFIG_DB_ID: ${{ secrets.NOTION_CONFIG_DB_ID }}
          NOTION_GEMINI_DB_ID: ${{ secrets.NOTION_GEMINI_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_NOTION_API_KEY || secrets.GEMINI_API_KEY }}
          ENABLE_GEMINI_API: ${{ steps.mode.outputs.enable_gemini }}
        run: |
          python scripts/gemini_trader.py
