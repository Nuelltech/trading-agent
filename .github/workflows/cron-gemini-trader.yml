name: Cron - Gemini Trader (Síntese Estratégica & Briefing Pré-Trade)

on:
  schedule:
    # Executa a cada 30 minutos em simultâneo com o Sync para o Notion (Segunda a Sexta)
    - cron: '*/30 * * * 1-5'
  workflow_dispatch: # Permite execução manual no GitHub Actions

jobs:
  gemini-trader:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests pymysql sqlalchemy cryptography pydantic pydantic-settings "google-genai>=0.8.0" google-generativeai

      - name: Executar Pipeline Gemini Trader (ETL 5 Fases)
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NOTION_API_KEY }}
          NOTION_CONFIG_DB_ID: ${{ secrets.NOTION_CONFIG_DB_ID }}
          NOTION_GEMINI_DB_ID: ${{ secrets.NOTION_GEMINI_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_NOTION_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gemini_trader.py
