name: Workflow - Backtest de Calibração de Liquidez (K-Factor)

on:
  workflow_dispatch: # Execução manual a qualquer momento no GitHub

jobs:
  run-backtest-calibration:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests pymysql sqlalchemy cryptography pydantic pydantic-settings numpy

      - name: Executar Backtest de Calibração de 1 Ano
        run: |
          python scripts/backtest_liquidity_calibration.py
